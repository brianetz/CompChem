# CompChem local dev environment (Mac-first; HPC target confs come later)
# Create:   mamba env create -f environment.yml
# Update:   mamba env update -f environment.yml --prune
# Activate: mamba activate compchem-agent
name: compchem-agent
channels:
  - conda-forge
dependencies:
  - python=3.11

  # -- Cheminformatics / structure prep (already used in src/) --
  - rdkit

  # -- Calculator abstraction --
  - ase

  # -- QC engines, easy tier first --
  - pyscf          # pip wheels are cross-platform too; conda-forge here for one-manager consistency
  # NOTE: conda-forge's "tblite" package is C/Fortran-library-only (no Python
  # bindings - its feedstock has no python output at all). The real Python
  # package (with the ASE calculator) is pip-only: see the pip section below.
  # NWChem intentionally NOT here yet - reintroduce when targeting Frontier/Defiant (HPC phase),
  # since it's the heaviest/most Linux-HPC-oriented install of the group.
  # engines/nwchem_engine.py DOES already exist (Phase 8, partial - architecture
  # plan Sec.19): the ASE-calculator wiring and the shared PASS/WARN/FAIL
  # classifier (analysis/qc_common.py) were built and syntax-checked without a
  # real binary available, so a local NWChem install is exactly what's needed
  # to actually validate (not just compile) that module - see its own
  # module docstring for the specific unverified assumptions.

  # -- Visualization (Phase 7) --
  - pymol-open-source   # headless structure rendering for ReporterAgent's markdown reports (src/engines/render_engine.py); conda-forge build, no display server needed

  # -- Output normalization --
  - cclib

  # -- Task execution --
  - parsl

  # -- Data handling --
  - pandas
  - numpy
  - scipy

  # -- Dev/test --
  - pytest
  - jupyterlab

  - pip
  - pip:
      - flowcept>=1.0.2  # ORNL provenance capture (PyPI: flowcept). >=1.0.2 floor is for Phase 9's agent-decision provenance (FlowceptTask + PROV_AGENT, storage/agent_provenance.py) - confirmed present in 1.0.2/1.0.3, not a new dependency, just a version floor.
      - academy-py      # Globus Labs federated agent framework (PyPI: academy-py)
      # NOTE (Phase 5, 2026-09-15): gpt-oss:20b via local Ollama didn't run
      # locally on this Mac; the LLM planning layer uses the hosted Anthropic
      # Claude API instead (see src/llm/planner_llm.py). `ollama` is left here
      # in case local serving is revisited later (e.g. a smaller model, or
      # for the HPC phase where the Claude API may not be reachable).
      - ollama          # Python client for local Ollama server (not currently used - see note above)
      - anthropic       # Anthropic Claude API SDK - Phase 5 LLM planning backend. Needs ANTHROPIC_API_KEY in the environment (never commit a key).
      - tblite[ase]     # GFN2-xTB Python bindings + ASE calculator (PyPI-only, prebuilt macOS wheels)

# Not included yet, add when needed:
#   - psi4 (conda-forge; known friction building from source on Apple Silicon per
#           github.com/psi4/psi4 issue #2333 - prefer the prebuilt conda-forge binary if added later)
#   - gpu4pyscf-cuda12x (Linux+NVIDIA only - Frontier/Defiant GPU phase, not local Mac)
#   - nwchem (Frontier/Defiant HPC phase)
